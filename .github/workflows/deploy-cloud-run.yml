# Trigger run for secrets verification
name: Deploy to Cloud Run

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Monthly review data refresh"]
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths:
      - index.html
      - app.js
      - styles.css
      - 404.html
      - assets/**
      - data/**
      - Dockerfile
      - nginx.conf
      - docker-entrypoint.sh
      - .github/workflows/deploy-cloud-run.yml

concurrency:
  group: cloud-run-deploy
  cancel-in-progress: true

env:
  PROJECT_ID: cprtqa-strategicanalytics-sp1
  REGION: us-west1
  REPO: copart-external-sentiment
  SERVICE: copart-external-sentiment
  RUNTIME_SA: cprtqasvc-cloudrun@cprtqa-strategicanalytics-sp1.iam.gserviceaccount.com

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Build and push image
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPO}/${SERVICE}:${GITHUB_SHA::7}"
          gcloud builds submit --tag "$IMAGE" --project "$PROJECT_ID"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy $SERVICE \
            --image "$IMAGE" \
            --region $REGION \
            --project $PROJECT_ID \
            --service-account $RUNTIME_SA \
            --no-allow-unauthenticated \
            --min-instances 0 --max-instances 10 \
            --cpu 1 --memory 512Mi \
            --timeout 300

      - name: Verify deployment
        run: |
          URL=$(gcloud run services describe $SERVICE \
            --region $REGION --project $PROJECT_ID \
            --format "value(status.url)")
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL")
          echo "Direct URL returned HTTP $STATUS (expected 401 or 403 — IAM-protected)"
          if [ "$STATUS" = "200" ]; then
            echo "::error::Service returned 200 on direct access — IAM may be misconfigured (allUsers binding?)"
            exit 1
          fi
